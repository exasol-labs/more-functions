[project]
name = "more-functions"
version = "0.1.0"
description = "Additional SQL and Lua functions for Exasol, packaged with deployment helpers and integration tests."
requires-python = ">=3.12,<3.14"
authors = [
    { name = "Sebastian Bär", email = "sebastian.baer@exasol.com" }
]
readme = "README.rst"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://www.exasol.com/"
Documentation = "https://exasol.github.io/more-functions/"
Source = "https://github.com/exasol/more-functions"
Issues = "https://github.com/exasol/more-functions/issues"
Changelog = "https://exasol.github.io/more-functions/changelog.html"

[tool.poetry]
requires-poetry = ">=2.3.0"
packages = [{ include = "exasol" }]

[dependency-groups]
dev = [
    "exasol-integration-test-docker-environment>=5.0.0,<7",
    "test-db-builder-python>1.0.0,<2",
    "exasol-toolbox>=10.0.0,<11",
    "hererocks==0.25.1",
    "pyexasol>=2.0.0,<3",
    "pytest>=9.0.0,<10",
    "pytest-exasol-backend>=1.3.0,<2",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
relative_files = true
source = [
    "exasol",
]

[tool.coverage.report]
fail_under = 0

[tool.black]
line-length = 88
verbose = false
include = "\\.pyi?$"

[tool.isort]
profile = "black"
force_grid_wrap = 2

[tool.pylint.master]
fail-under = 5.0
ignore = []

[tool.pylint.format]
max-line-length = 88
max-module-lines = 800

[tool.ruff.lint]
extend-ignore = [
    "E",
    "F",
    "UP",
    "D",
]
extend-select = ["F401"]
unfixable = []

[[tool.mypy.overrides]]
module = [
    "test.*",
]
ignore_errors = true
ignore_missing_imports = true

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.sonar]
projectKey = "com.exasol:more-functions"
host.url = "https://sonarcloud.io"
organization = "exasol"
